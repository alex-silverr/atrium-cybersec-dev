services:
  atrium:
    container_name: atrium
    build: .
    tty: true
    ports:
      - 127.0.0.1:9090:9090

  zap:
    container_name: zap-atrium
    image: zaproxy/zap-stable
    tty: true
    ports:
      - 127.0.0.1:8090:8090
      - 127.0.0.1:8080:8080
    command: ["zap-webswing.sh"]
    depends_on:
      atrium:
        condition: service_started
        restart: true
    volumes:
      - ./:/src
    extra_hosts:
      - "host.docker.internal:host-gateway"

  semgrep:
    container_name: semgrep-atrium
    image: semgrep/semgrep
    tty: true
    command: ["semgrep", "--config=scan-rules/", "src/"]
    depends_on:
      atrium:
        condition: service_started
        restart: true
    volumes:
      - ./:/src